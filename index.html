<!DOCTYPE html>
<html>
<head>
    <title>Meine erste Webseite</title>

    <style>
        body {
            background-color: lightblue;
            font-family: Arial;
            text-align: center;
            padding-top: 100px;
        }

        h1 {
            color: darkblue; 
        }

        p {
            font-size: 20px;
        }

        button {
            background-color: darkblue;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
        }

        button:hover {
            background-color: blue;
        }
    </style>
</head>

<body>

    <h1>Meine erste Webseite 🚀</h1>

    <p id="nachricht">Klicke auf den Button!</p>

    <button onclick="hallo()">Drück mich!</button>
 <button onclick="tschö()">Drück mich nochmal</button>
    <button> onclick="back()">drück doch</button>
    <script>
        function hallo() {
            document.body.style.backgroundColor = "red" ; document.getElementById("nachricht").innerHTML =
                "du pimmel 🎉";
        } 

    
            function tschö() {
                document.body.style.backgroundColor = "lightgreen" ; document.getElementById("nachricht").innerHTML = "kleiner pimmel";
            }
        function back() { 
            document.body.style.backgroundColor = "darkblue" ; document.getElementById("nachricht").innerHTML = "Meine erste Website"; }
    </script>

</body>
</html>
